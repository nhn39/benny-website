<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="static/css/base.css" />
        <link rel="stylesheet" href="static/css/story.css" />

        <title>Benny the 🐈 story</title>
    </head>

    <body>
        <section class="story-intro">
            <h1>Benny</h1>
            <p>A Story Through the Years</p>
        </section>

        <section class="story-scene" data-animation="split">
            <img src="static/img/IMG_0708_1.jpg" class="story-photo" alt="Young Benny" />

            <div class="story-text">
                <p>Once upon a time, there was a little kitten named Benny.</p>
            </div>
        </section>

        <section class="story-scene" data-animation="zoom">
            <img src="static/img/IMG_0855.JPG" class="story-photo" alt="Benny in 2017" />

            <div class="story-text">
                <p>An orphan kitten, but never alone.</p>
            </div>
        </section>

        <section class="video-scene" data-scroll-speed="340">
            <div class="video-sticky">
                <video class="story-video" muted playsinline preload="metadata">
                    <source src="static/videos/4_kittens_eating.mp4" type="video/mp4" />
                </video>

                <div class="video-text">
                    <p>Benny began to explore the world around him with his sisters.</p>
                </div>
            </div>
        </section>

        <script src="static/js/bennyLogo.js"></script>
        <script src="static/js/storyScroll.js"></script>
    </body>
</html>
